services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rock_paper_scissors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret123

    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8095:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/rock_paper_scissors
      DB_USER: postgres
      DB_PASSWORD: secret123
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata: